{% load static %}
<section class="player">
  <canvas width="840"
          height="840"
          aria-label="Fadensimulation des gewählten Fortschritts">
  </canvas>
  <label><input type="checkbox" data-nails {% if playback.positions %}checked{% endif %}> Nägel anzeigen</label>
  {% if art and playback.firstExtra %}
    <label><input type="checkbox" data-plan-target="{% url 'asset' art.pk 'target' %}"> Nagelplan auf der Motivvorlage ansehen</label>
  {% endif %}
  <div class="controls">
    <button type="button" data-back aria-label="Eine Verbindung zurück">−</button>
    <input aria-label="Simulationsfortschritt" type="range" min="0" value="0">
    <button type="button" data-next aria-label="Eine Verbindung weiter">+</button>
  </div>
  <output>
  </output>
</section>
{{ playback|json_script:"playback" }}<script defer src="{% static 'studio/player.js' %}"></script>
