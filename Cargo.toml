[package]
name = "stringy"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
