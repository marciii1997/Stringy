name: Stringy release checks
on: [push, pull_request]
jobs:
  winding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo test --locked --release
      - run: cargo build --locked --release
      - run: pip install -r requirements.txt
      - run: python manage.py test
        env:
          DJANGO_SECRET_KEY: ci-ephemeral
          STRINGY_RELEASE_CHECK: '1'
      - run: python manage.py winding_trials --verify --output regression
        env:
          DJANGO_SECRET_KEY: ci-ephemeral
      - uses: actions/upload-artifact@v4
        with:
          name: winding-regression
          path: |
            regression/messung.json
            regression/*/vergleich.png
